name: Roll milestone

on:
  release:
    types: [published]

permissions:
  contents: read
  issues: write

jobs:
  roll-milestone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Roll milestone
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: America/Toronto
        run: dotnet run ./scripts/roll-milestone.cs
